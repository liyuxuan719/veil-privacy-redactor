name: Bootstrap VEIL repository

on:
  push:
    paths:
      - .github/workflows/bootstrap-veil.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write
  pages: write

concurrency:
  group: bootstrap-veil
  cancel-in-progress: true

jobs:
  bootstrap:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4

      - name: Extract VEIL source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f veil-source.zip
          cp .github/workflows/bootstrap-veil.yml "$RUNNER_TEMP/bootstrap-veil.yml"
          archive_dir="$RUNNER_TEMP/veil-source"
          rm -rf "$archive_dir"
          mkdir -p "$archive_dir"
          unzip -q veil-source.zip -d "$archive_dir"
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a "$archive_dir/." .
          rm -f .github/workflows/pages.yml
          cp "$RUNNER_TEMP/bootstrap-veil.yml" .github/workflows/bootstrap-veil.yml
          rm -f veil-source.zip

      - name: Validate imported source
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/app.js
          node --check assets/app.js
          node --check assets/guide.js
          node --check src/redaction.js
          node --check sw.js

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import VEIL privacy redactor"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
